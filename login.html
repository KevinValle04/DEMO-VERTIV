<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertiv MXL — Iniciar Sesión</title>
  <style>
/* =====================================================
   Vertiv Asset Control — Executive Enterprise UI
   Planta Mexicali (MXL)
   ===================================================== */

:root {
  --vertiv-red: #d0021b;
  --vertiv-red-dark: #b00116;
  --vertiv-red-subtle: rgba(208, 2, 27, 0.08);
  
  --vertiv-dark: #0f172a;
  --vertiv-nav: #0d0f12;
  
  --slate-900: #0f172a;
  --slate-800: #1e293b;
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-300: #cbd5e1;
  --slate-200: #e2e8f0;
  --slate-100: #f1f5f9;
  --slate-50:  #f8fafc;
  
  --vertiv-white: #ffffff;
  --vertiv-border: #e2e8f0;
  --vertiv-border-strong: #cbd5e1;
  
  --vertiv-success-bg: #f0fdf4;
  --vertiv-success-text: #15803d;
  --vertiv-success-border: #bbf7d0;
  
  --vertiv-warning-bg: #fffbeb;
  --vertiv-warning-text: #b45309;
  --vertiv-warning-border: #fde68a;
  
  --vertiv-info-bg: #f0f9ff;
  --vertiv-info-text: #0369a1;
  --vertiv-info-border: #bae6fd;
  
  --vertiv-danger-bg: #fef2f2;
  --vertiv-danger-text: #b91c1c;
  --vertiv-danger-border: #fecaca;
  
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  
  --radius-sm: 5px;
  --radius: 8px;
  --radius-lg: 10px;
  
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font);
  background-color: var(--slate-100);
  color: var(--slate-800);
  font-size: 13.5px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ─── NAVBAR ──────────────────────────────────────── */
.navbar {
  background: var(--vertiv-nav);
  padding: 0 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: sticky;
  top: 0;
  z-index: 200;
  height: 64px;
}

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  padding: 0;
}

.brand-logo {
  height: 28px;
  width: auto;
  filter: invert(1) brightness(2);
  display: block;
}

.brand-divider {
  width: 1px;
  height: 24px;
  background: rgba(255, 255, 255, 0.16);
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-size: 13px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.2px;
}

.brand-sub {
  font-size: 11px;
  color: var(--slate-400);
  letter-spacing: 0.3px;
}

.navbar-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-link {
  display: inline-flex;
  align-items: center;
  padding: 8px 16px;
  color: var(--slate-400);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.1px;
  border-radius: var(--radius-sm);
  transition: all 0.15s ease;
  white-space: nowrap;
}

.nav-link:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}

.nav-link.active {
  color: #ffffff;
  background: var(--vertiv-red);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(208, 2, 27, 0.4);
}

/* ─── LAYOUT ──────────────────────────────────────── */
.page-header {
  background: var(--vertiv-white);
  border-bottom: 1px solid var(--vertiv-border);
  padding: 20px 36px 18px;
}

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--slate-900);
  letter-spacing: -0.2px;
}

.page-subtitle {
  font-size: 13px;
  color: var(--slate-500);
  margin-top: 3px;
  font-weight: 400;
}

.container {
  max-width: 1040px;
  margin: 0 auto;
  padding: 24px 20px;
  flex: 1;
  width: 100%;
}

/* ─── STEP TRACKER ─────────────────────────────────── */
.steps-track {
  display: flex;
  margin-bottom: 20px;
  background: var(--vertiv-white);
  border: 1px solid var(--vertiv-border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
}

.step-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-right: 1px solid var(--vertiv-border);
  background: var(--vertiv-white);
  transition: background 0.15s ease;
}

.step-item:last-child {
  border-right: none;
}

.step-item.active {
  background: var(--slate-50);
}

.step-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--slate-200);
  color: var(--slate-600);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-item.active .step-num {
  background: var(--vertiv-red);
  color: #ffffff;
}

.step-item.done .step-num {
  background: var(--vertiv-success-text);
  color: #ffffff;
}

.step-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--slate-500);
}

.step-item.active .step-label {
  color: var(--slate-900);
}

/* ─── CARDS ────────────────────────────────────────── */
.card {
  background: var(--vertiv-white);
  border: 1px solid var(--vertiv-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--slate-100);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--slate-900);
  letter-spacing: -0.1px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body {
  padding: 20px;
}

/* ─── GRID ─────────────────────────────────────────── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 768px) {
  .grid-2, .grid-3 {
    grid-template-columns: 1fr;
  }
  .navbar {
    height: auto;
    padding: 12px 16px;
    flex-direction: column;
    gap: 10px;
  }
  .navbar-brand {
    gap: 12px;
  }
  .brand-logo {
    height: 24px;
  }
  .navbar-nav {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 4px;
    padding: 0;
  }
  .nav-link {
    flex: 1;
    text-align: center;
    justify-content: center;
    padding: 7px 6px;
    font-size: 11.5px;
  }
  .page-header {
    padding: 14px 16px;
  }
  .page-title {
    font-size: 16px;
  }
  .container {
    padding: 14px 12px;
  }
  .steps-track {
    flex-direction: column;
  }
  .step-item {
    border-right: none;
    border-bottom: 1px solid var(--vertiv-border);
    padding: 10px 14px;
  }
  .card-header {
    padding: 12px 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .card-body {
    padding: 14px;
  }
  .form-control, .form-select {
    font-size: 16px !important; /* Previene auto-zoom molesto en Safari iOS */
    padding: 9px 12px;
  }
  .btn {
    min-height: 40px;
  }
  .btn-xs, .btn-sm {
    min-height: 30px;
  }
  .form-actions {
    flex-direction: column-reverse;
    gap: 8px;
  }
  .form-actions .btn {
    width: 100%;
  }
  .sig-canvas {
    height: 130px;
  }
  .scanner-controls {
    justify-content: center;
  }
  .scanner-controls .close-scan-btn {
    margin-left: 0;
    width: 100%;
    margin-top: 6px;
    text-align: center;
  }
}

/* ─── SCANNER MOBILE FIXES ─────────────────────────── */
#reader, #readerDevolucion, #readerLocalizador, #readerGafete, #readerGafeteDev {
  width: 100% !important;
  border: none !important;
}
#reader video, #readerDevolucion video, #readerLocalizador video, #readerGafete video, #readerGafeteDev video {
  width: 100% !important;
  height: auto !important;
  border-radius: var(--radius-sm);
  display: block;
}

/* ─── FORMS ────────────────────────────────────────── */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--slate-600);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.form-control, .form-select {
  width: 100%;
  padding: 8px 12px;
  font-size: 13.5px;
  font-family: var(--font);
  border: 1px solid var(--slate-300);
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: var(--slate-900);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.form-control:focus, .form-select:focus {
  border-color: var(--vertiv-red);
  box-shadow: 0 0 0 3px rgba(208, 2, 27, 0.12);
}

.form-control::placeholder {
  color: var(--slate-400);
}

textarea.form-control {
  resize: vertical;
  min-height: 72px;
}

/* ─── BUTTONS ──────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.4;
}

.btn-primary {
  background: var(--vertiv-red);
  color: #ffffff;
  border-color: var(--vertiv-red);
}
.btn-primary:hover {
  background: var(--vertiv-red-dark);
  border-color: var(--vertiv-red-dark);
  box-shadow: var(--shadow-sm);
}

.btn-dark {
  background: var(--slate-900);
  color: #ffffff;
  border-color: var(--slate-900);
}
.btn-dark:hover {
  background: #020617;
  border-color: #020617;
}

.btn-outline {
  background: #ffffff;
  border-color: var(--slate-300);
  color: var(--slate-700);
}
.btn-outline:hover {
  background: var(--slate-50);
  border-color: var(--slate-400);
  color: var(--slate-900);
}

.btn-success {
  background: #059669;
  color: #ffffff;
  border-color: #059669;
}
.btn-success:hover {
  background: #047857;
  border-color: #047857;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--slate-600);
  padding: 6px 10px;
}
.btn-ghost:hover {
  background: var(--slate-100);
  color: var(--slate-900);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}
.btn-xs {
  padding: 3px 8px;
  font-size: 11px;
}

/* ─── SCANNER ──────────────────────────────────────── */
.scanner-wrapper {
  background: #0a0a0a;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid #2a2a2a;
}

.scanner-tip {
  background: #111111;
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid #222222;
}

.scanner-video-area {
  position: relative;
}

.laser-line {
  position: absolute;
  top: 50%;
  left: 8%;
  right: 8%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255,40,40,0.95) 20%, rgba(255,40,40,0.95) 80%, transparent);
  box-shadow: 0 0 8px rgba(255,40,40,0.8);
  z-index: 10;
  pointer-events: none;
  animation: scan-pulse 1.8s ease-in-out infinite;
}

@keyframes scan-pulse {
  0%, 100% { opacity: 0.95; }
  50% { opacity: 0.35; }
}

.scanner-controls {
  background: #111111;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid #222222;
}

.scanner-controls-label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.45);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 2px;
}

.zoom-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.8);
  font-size: 11.5px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.zoom-btn:hover, .zoom-btn.active {
  background: var(--vertiv-red);
  border-color: var(--vertiv-red);
  color: #ffffff;
}

.torch-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.8);
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  display: none;
  transition: all 0.15s;
}
.torch-btn.on {
  background: #f59e0b;
  border-color: #f59e0b;
  color: #000000;
}

.close-scan-btn {
  margin-left: auto;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.7);
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.close-scan-btn:hover {
  background: var(--vertiv-red);
  border-color: var(--vertiv-red);
  color: #ffffff;
}

/* ─── ACTION BAR ───────────────────────────────────── */
.action-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 0 0;
}

.input-group {
  display: flex;
  gap: 0;
}

.input-group .form-control {
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  flex: 1;
}

.input-group .btn {
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  border-left: none;
}

/* ─── TABLE ────────────────────────────────────────── */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--vertiv-border);
  border-radius: var(--radius-sm);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.table thead {
  background: var(--slate-50);
}

.table th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--vertiv-border);
  white-space: nowrap;
  text-align: left;
}

.table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--slate-100);
  vertical-align: middle;
  color: var(--slate-800);
}

.table tbody tr:last-child td {
  border-bottom: none;
}
.table tbody tr:hover td {
  background: var(--slate-50);
}
.table tbody tr.row-returned td {
  background: #f0fdf4;
}

.table-empty {
  text-align: center;
  padding: 36px 0 !important;
  color: var(--slate-500) !important;
  font-style: italic;
}

/* ─── BADGES ───────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  letter-spacing: 0.2px;
  white-space: nowrap;
}

.badge-success {
  background: var(--vertiv-success-bg);
  color: var(--vertiv-success-text);
  border: 1px solid var(--vertiv-success-border);
}
.badge-warning {
  background: var(--vertiv-warning-bg);
  color: var(--vertiv-warning-text);
  border: 1px solid var(--vertiv-warning-border);
}
.badge-info {
  background: var(--vertiv-info-bg);
  color: var(--vertiv-info-text);
  border: 1px solid var(--vertiv-info-border);
}
.badge-danger {
  background: var(--vertiv-danger-bg);
  color: var(--vertiv-danger-text);
  border: 1px solid var(--vertiv-danger-border);
}
.badge-gray {
  background: var(--slate-100);
  color: var(--slate-700);
  border: 1px solid var(--slate-200);
}

/* ─── SIGNATURE ────────────────────────────────────── */
.sig-box {
  border: 1px solid var(--vertiv-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #ffffff;
}

.sig-canvas {
  display: block;
  width: 100%;
  height: 120px;
  cursor: crosshair;
  touch-action: none;
}

.sig-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  background: var(--slate-50);
  border-top: 1px solid var(--vertiv-border);
  font-size: 11px;
  color: var(--slate-500);
}

/* ─── ALERTS ───────────────────────────────────────── */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid;
  margin-bottom: 16px;
  line-height: 1.5;
}

.alert-success {
  background: var(--vertiv-success-bg);
  color: var(--vertiv-success-text);
  border-color: var(--vertiv-success-border);
}
.alert-info {
  background: var(--vertiv-info-bg);
  color: var(--vertiv-info-text);
  border-color: var(--vertiv-info-border);
}
.alert-warning {
  background: var(--vertiv-warning-bg);
  color: var(--vertiv-warning-text);
  border-color: var(--vertiv-warning-border);
}

/* ─── SECTION DIVIDER ──────────────────────────────── */
.section-divider {
  font-size: 11px;
  font-weight: 700;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 8px 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--vertiv-border);
}

/* ─── EMPLOYEE SUMMARY ─────────────────────────────── */
.employee-card {
  background: var(--slate-50);
  border: 1px solid var(--vertiv-border);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  margin-top: 14px;
}

.employee-card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

@media (max-width: 640px) {
  .employee-card-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.employee-field-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--slate-500);
  margin-bottom: 2px;
}

.employee-field-value {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--slate-900);
}

/* ─── FOOTER ───────────────────────────────────────── */
.footer {
  background: var(--vertiv-white);
  border-top: 1px solid var(--vertiv-border);
  padding: 16px 24px;
  text-align: center;
  font-size: 11.5px;
  color: var(--slate-500);
  margin-top: auto;
}

.footer strong {
  color: var(--slate-700);
}

/* ─── FORM ACTIONS ─────────────────────────────────── */
.form-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding-top: 16px;
  border-top: 1px solid var(--slate-100);
  margin-top: 8px;
  flex-wrap: wrap;
}

/* ─── PRINT STYLES ─────────────────────────────────── */
@media print {
  .navbar, .btn, .scanner-wrapper, .action-bar, .sig-footer, .no-print, .steps-track {
    display: none !important;
  }
  body {
    background: #ffffff;
  }
  .card {
    box-shadow: none;
    border: 1px solid #cccccc;
  }
}

/* ─── USER SESSION NAV ─────────────────────────────── */
.user-nav-box {
  display: flex;
  align-items: center;

<script>
  function accesoRapido(nombre, rol) {
    const sesion = {
      nombre: nombre,
      rol: rol,
      correo: rol === 'Administrador TI' ? 'admin.mxl@vertiv.com' : 'almacen.mxl@vertiv.com',
      planta: document.getElementById('loginPlanta').value,
      timestamp: new Date().toISOString()
    };
    localStorage.setItem('VERTIV_USER', JSON.stringify(sesion));
    window.location.href = 'index.html';
  }

  function ejecutarLogin(e) {
    e.preventDefault();
    const user = document.getElementById('loginUser').value.trim();
    const esSup = /supervisor|almacen|carlos/i.test(user);
    const sesion = {
      nombre: esSup ? 'Carlos Sánchez' : 'Ing. Roberto Garza',
      rol: esSup ? 'Supervisor Almacén' : 'Administrador TI',
      correo: user,
      planta: document.getElementById('loginPlanta').value,
      timestamp: new Date().toISOString()
    };
    localStorage.setItem('VERTIV_USER', JSON.stringify(sesion));
    window.location.href = 'index.html';
  }
</script>
